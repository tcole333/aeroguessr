title: Plane Game WebSocket Schema
version: 1
messages:
  stateSync:
    payload:
      $ref: '#/$defs/FullRoomState'
  delta:
    payload:
      $ref: '#/$defs/DeltaPayload'
  roundStart:
    payload:
      $ref: '#/$defs/RoundStartPayload'
  roundResult:
    payload:
      $ref: '#/$defs/RoundResultPayload'
  playerJoined:
    payload:
      $ref: '#/$defs/PlayerJoinedPayload'
  playerLeft:
    payload:
      $ref: '#/$defs/PlayerLeftPayload'
  newHost:
    payload:
      $ref: '#/$defs/NewHostPayload'
  error:
    payload:
      $ref: '#/$defs/ErrorPayload'
  pong:
    payload:
      $ref: '#/$defs/PingPongPayload'
  ping:
    payload:
      $ref: '#/$defs/PingPongPayload'
  guess:
    payload:
      $ref: '#/$defs/GuessPayload'
  selectPlane:
    payload:
      $ref: '#/$defs/SelectPlanePayload'
  startRound:
    payload:
      $ref: '#/$defs/StartRoundPayload'
  transferHost:
    payload:
      $ref: '#/$defs/TransferHostPayload'
  claimHost:
    payload:
      $ref: '#/$defs/ClaimHostPayload'
  planeSelectedConfirm:
    payload:
      $ref: '#/$defs/PlaneSelectedConfirmPayload'
$defs:
  GuessPayload:
    description: Payload for the player guess message.
    example:
      airport_code: JFK
    properties:
      airport_code:
        description: Player's guessed airport IATA/ICAO code.
        title: Airport Code
        type: string
    required:
    - airport_code
    title: GuessPayload
    type: object
  PlayerJoinedPayload:
    description: Payload for the playerJoined message.
    example:
      nickname: NewPlayer123
    properties:
      nickname:
        description: Nickname of the player who joined.
        title: Nickname
        type: string
    required:
    - nickname
    title: PlayerJoinedPayload
    type: object
  PlaneSelectedConfirmPayload:
    description: Payload sent to host confirming successful plane selection.
    example:
      destination: KJFK
      guess_direction: destination
      hex: a1b2c3
      origin: KBOS
    properties:
      hex:
        description: ICAO24 hex code of the selected plane.
        title: Hex
        type: string
      origin:
        description: Origin airport ICAO code.
        title: Origin
        type: string
      destination:
        description: Destination airport ICAO code.
        title: Destination
        type: string
      guess_direction:
        description: Which airport players will guess ('origin' or 'destination').
        title: Guess Direction
        type: string
    required:
    - hex
    - origin
    - destination
    - guess_direction
    title: PlaneSelectedConfirmPayload
    type: object
  RoundStartPayload:
    description: Payload for the server roundStart message.
    example:
      direction: destination
      hex: a1b2c3
      round_number: 4
      timeout_s: 30
    properties:
      hex:
        description: ICAO24 hex code of the plane for this round.
        title: Hex
        type: string
      timeout_s:
        description: Duration of the guessing round in seconds.
        title: Timeout S
        type: integer
      direction:
        description: Whether to guess 'origin' or 'destination'.
        title: Direction
        type: string
      round_number:
        description: The current round number.
        title: Round Number
        type: integer
    required:
    - hex
    - timeout_s
    - direction
    - round_number
    title: RoundStartPayload
    type: object
  StartRoundPayload:
    description: Payload for the host startRound message (currently empty).
    properties: {}
    title: StartRoundPayload
    type: object
  PlayerLeftPayload:
    description: Payload for the playerLeft message.
    example:
      nickname: LeavingPlayer456
    properties:
      nickname:
        description: Nickname of the player who left.
        title: Nickname
        type: string
    required:
    - nickname
    title: PlayerLeftPayload
    type: object
  DeltaPayload:
    $defs:
      PlaneState:
        description: 'Represents the smoothed state of an aircraft stored in Redis.


          Includes core position/velocity, a capped trail, and cached enrichment data.'
        properties:
          hex_ident:
            description: Aircraft ICAO hex identifier.
            title: Hex Ident
            type: string
          lat:
            description: Smoothed latitude.
            title: Lat
            type: number
          lon:
            description: Smoothed longitude.
            title: Lon
            type: number
          alt:
            description: Smoothed altitude in feet.
            title: Alt
            type: number
          lat_v:
            description: Smoothed latitude velocity.
            title: Lat V
            type: number
          lon_v:
            description: Smoothed longitude velocity.
            title: Lon V
            type: number
          alt_v:
            description: Smoothed altitude velocity (fpm).
            title: Alt V
            type: number
          last_update_ts:
            description: Timestamp of the last update.
            title: Last Update Ts
            type: number
          trail:
            description: List of recent (lat, lon, alt) tuples, capped at 30.
            items:
              maxItems: 3
              minItems: 3
              prefixItems:
              - type: number
              - type: number
              - type: number
              type: array
            title: Trail
            type: array
          callsign:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            description: Aircraft callsign (cached).
            title: Callsign
          origin_country:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            description: Origin country based on ICAO24 (cached).
            title: Origin Country
          category:
            anyOf:
            - type: integer
            - type: 'null'
            default: null
            description: Aircraft category code (cached).
            title: Category
          origin:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            description: Origin airport ICAO (cached).
            title: Origin
          destination:
            anyOf:
            - type: string
            - type: 'null'
            default: null
            description: Destination airport ICAO (cached).
            title: Destination
        required:
        - hex_ident
        - lat
        - lon
        - alt
        - lat_v
        - lon_v
        - alt_v
        - last_update_ts
        title: PlaneState
        type: object
    description: Payload for the server delta message, containing state changes.
    example:
      planes:
        removed:
        - d4e5f6
        updated:
        - alt: 5000
          alt_v: 10.0
          callsign: UAL123
          category: 2
          destination: KJFK
          hex_ident: a1b2c3
          last_update_ts: 1747514868541.5342
          lat: 42.36
          lat_v: 0.01
          lon: -71.05
          lon_v: -0.01
          origin: KBOS
          origin_country: USA
          trail:
          - - 42.359
            - -71.049
            - 4990
      scores:
        Player1: 250
    properties:
      planes:
        anyOf:
        - additionalProperties:
            items:
              anyOf:
              - $ref: '#/$defs/PlaneState'
              - type: string
            type: array
          type: object
        - type: 'null'
        default: null
        description: Changes in plane states. 'updated' contains full PlaneState objects,
          'removed' contains hex IDs.
        title: Planes
      scores:
        anyOf:
        - additionalProperties:
            type: integer
          type: object
        - type: 'null'
        default: null
        description: 'Updated scores for players {nickname: new_total_score}.'
        title: Scores
    title: DeltaPayload
    type: object
  NewHostPayload:
    description: Payload for the server newHost message.
    example:
      nickname: PromotedPlayer
    properties:
      nickname:
        description: Nickname of the new host.
        title: Nickname
        type: string
    required:
    - nickname
    title: NewHostPayload
    type: object
  ClaimHostPayload:
    description: Payload for the player claimHost message (currently empty).
    properties: {}
    title: ClaimHostPayload
    type: object
  FullRoomState:
    description: Represents the complete state of a room to be sent on connect.
    example:
      players: {}
      room_meta: null
    properties:
      room_meta:
        anyOf:
        - additionalProperties: true
          type: object
        - type: 'null'
        description: Current metadata of the room.
        title: Room Meta
      players:
        additionalProperties:
          additionalProperties: true
          type: object
        description: Dictionary of players currently in the room, keyed by nickname.
        title: Players
        type: object
    required:
    - room_meta
    - players
    title: FullRoomState
    type: object
  SelectPlanePayload:
    description: Payload for the host selectPlane message.
    example:
      hex: a1b2c3
    properties:
      hex:
        description: ICAO24 hex code of the selected plane.
        title: Hex
        type: string
    required:
    - hex
    title: SelectPlanePayload
    type: object
  PingPongPayload:
    description: Payload for ping and pong messages.
    example:
      seq: 12345
    properties:
      seq:
        description: Sequence number for matching ping/pong.
        title: Seq
        type: integer
    required:
    - seq
    title: PingPongPayload
    type: object
  ErrorPayload:
    $defs:
      ErrorCode:
        description: Standardized error codes for WebSocket error messages.
        enum:
        - UNKNOWN_ERROR
        - INVALID_MESSAGE_FORMAT
        - INVALID_PAYLOAD
        - INTERNAL_SERVER_ERROR
        - ROOM_NOT_FOUND
        - NICKNAME_TAKEN
        - NOT_IN_ROOM
        - NOT_HOST
        - PLAYER_NOT_FOUND
        - CANNOT_TRANSFER_TO_SELF
        - CLAIM_HOST_NOT_ALLOWED
        - CLAIM_HOST_STILL_CONNECTED
        - CLAIM_HOST_TOO_EARLY
        - INVALID_STATE_FOR_ACTION
        - PLANE_NOT_FOUND
        - PLANE_ALREADY_USED
        - GUESS_OUTSIDE_ROUND
        - ALREADY_GUESSED
        - INVALID_ACTION_IN_SOLO_MODE
        - PLANE_DATA_INCOMPLETE_FOR_GUESS
        title: ErrorCode
        type: string
    description: Payload for the server error message.
    example:
      code: GUESS_OUTSIDE_ROUND
      message: Guesses only allowed during round.
    properties:
      code:
        $ref: '#/$defs/ErrorCode'
        description: Standardized error code.
      message:
        description: User-friendly error message.
        title: Message
        type: string
    required:
    - code
    - message
    title: ErrorPayload
    type: object
  TransferHostPayload:
    description: Payload for the host transferHost message.
    example:
      to_nickname: SuccessorSam
    properties:
      to_nickname:
        description: Nickname of the player to transfer host to.
        title: To Nickname
        type: string
    required:
    - to_nickname
    title: TransferHostPayload
    type: object
  RoundResultPayload:
    $defs:
      RoundResultDetail:
        description: Detailed result for a single player in a round.
        properties:
          nickname:
            title: Nickname
            type: string
          guess:
            anyOf:
            - type: string
            - type: 'null'
            title: Guess
          correct_code:
            title: Correct Code
            type: string
          score_awarded:
            title: Score Awarded
            type: integer
          current_total_score:
            title: Current Total Score
            type: integer
        required:
        - nickname
        - guess
        - correct_code
        - score_awarded
        - current_total_score
        title: RoundResultDetail
        type: object
    description: Payload for the server roundResult message.
    example:
      next_host_nickname: null
      results:
      - correct_code: BOS
        current_total_score: 150
        guess: JFK
        nickname: Player1
        score_awarded: 0
      - correct_code: BOS
        current_total_score: 200
        guess: BOS
        nickname: Player2
        score_awarded: 100
    properties:
      results:
        description: List containing results for each player.
        items:
          $ref: '#/$defs/RoundResultDetail'
        title: Results
        type: array
      next_host_nickname:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Nickname of the player who will host the next round (if changed).
        title: Next Host Nickname
    required:
    - results
    title: RoundResultPayload
    type: object
