openapi: 3.1.0
info:
  title: Plane Guessing Game API
  description: API for managing game rooms, players, and flight data.
  version: 0.1.0
paths:
  /:
    get:
      summary: Read Root
      description: Root endpoint providing a basic welcome message.
      operationId: read_root__get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
  /healthz:
    get:
      summary: Health Check
      description: Health check endpoint to verify service status.
      operationId: health_check_healthz_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v0/rooms:
    post:
      tags:
        - rooms
      summary: Create a new game room
      description: Creates a new game room with a unique code and returns the code
        and WebSocket URL for the host.
      operationId: create_room_api_v0_rooms_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateRequest"
        required: true
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomCreateResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v0/rooms/{room_code}/join:
    post:
      tags:
        - rooms
      summary: Join an existing game room
      description: Allows a player to join a room using a code and nickname. Checks
        for room existence and nickname uniqueness.
      operationId: join_room_api_v0_rooms__room_code__join_post
      parameters:
        - name: room_code
          in: path
          required: true
          schema:
            type: string
            title: Room Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomJoinRequest"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomJoinResponse"
        "404":
          description: Room not found
        "409":
          description: Nickname already taken in this room
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RoomCreateRequest:
      properties:
        host_nickname:
          type: string
          maxLength: 20
          minLength: 3
          title: Host Nickname
          description: Nickname for the player hosting the room.
        mode:
          $ref: "#/components/schemas/ScoringMode"
          description: Scoring mode for the room.
          default: Exact
        round_timeout_seconds:
          type: integer
          maximum: 120.0
          minimum: 10.0
          title: Round Timeout Seconds
          description: Duration of each guessing round in seconds.
          default: 30
      type: object
      required:
        - host_nickname
      title: RoomCreateRequest
      description: Request body for creating a new game room.
      example:
        host_nickname: HostessHannah
        mode: Distance
        round_timeout_seconds: 60
    RoomCreateResponse:
      properties:
        room_code:
          type: string
          title: Room Code
          description: The unique 4-letter code for the created room.
        ws_url:
          type: string
          title: Ws Url
          description: The WebSocket URL for the host to connect to.
      type: object
      required:
        - room_code
        - ws_url
      title: RoomCreateResponse
      description: Response body after successfully creating a game room.
      example:
        room_code: ABCD
        ws_url: ws://localhost:8000/ws/ABCD/HostessHannah
    RoomJoinRequest:
      properties:
        nickname:
          type: string
          maxLength: 20
          minLength: 3
          title: Nickname
          description: Nickname for the player joining the room.
      type: object
      required:
        - nickname
      title: RoomJoinRequest
      description: Request body for joining an existing game room.
      example:
        nickname: JoinerJane
    RoomJoinResponse:
      properties:
        ws_url:
          type: string
          title: Ws Url
          description: The WebSocket URL for the player to connect to.
      type: object
      required:
        - ws_url
      title: RoomJoinResponse
      description: Response body after successfully joining a game room.
      example:
        ws_url: ws://localhost:8000/ws/WXYZ/JoinerJane
    ScoringMode:
      type: string
      enum:
        - Exact
        - Distance
      title: ScoringMode
      description: Enum for available scoring modes.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
