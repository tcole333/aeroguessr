repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0 # Use the latest stable version
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1024'] # Increased limit for files like package-lock.json
      - id: check-merge-conflict
      - id: debug-statements

  # Ruff (Python Linter & Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.5 # Use the latest stable version compatible with ruff.toml
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  # Prettier (JS/TS/JSON/MD Formatter)
  - repo: local
    hooks:
      - id: prettier-frontend
        name: Run Prettier (frontend)
        entry: bash
        args:
          - -c
          - |
            set -e; set -x;
            cd frontend || exit 1;
            files_to_format=();
            for arg in "$@"; do
              files_to_format+=("${arg#frontend/}");
            done;
            if [ ${#files_to_format[@]} -eq 0 ]; then
              exit 0;
            fi;
            exec node_modules/.bin/prettier --write --ignore-path ../.gitignore "${files_to_format[@]}"
        language: system
        types_or: [javascript, json, css, scss, html, yaml, markdown]
        files: ^frontend/
        pass_filenames: true

  # ESLint for JavaScript/TypeScript
  - repo: local
    hooks:
      - id: eslint-frontend
        name: Run ESLint (frontend)
        entry: bash
        args:
          - -c
          - |
            set -e; set -x;
            cd frontend || exit 1;
            files_to_lint=();
            for arg in "$@"; do
              files_to_lint+=("${arg#frontend/}");
            done;
            if [ ${#files_to_lint[@]} -eq 0 ]; then
              exit 0;
            fi;
            exec node_modules/.bin/eslint --fix --ext .js,.jsx,.ts,.tsx "${files_to_lint[@]}"
        language: system
        types_or: [javascript, ts, tsx]
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: true

  # TypeScript type checking
  - repo: local
    hooks:
      - id: frontend-type-check
        name: Frontend TypeScript type check
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

      - id: frontend-tests
        name: Run frontend tests
        entry: bash -c 'set -e; set -x; cd frontend && npm run test:ci'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: run-backend-unit-tests
        name: Run backend unit tests
        entry: poetry run pytest tests/backend -m "not integration"
        language: system
        stages: [pre-commit]
        pass_filenames: false
