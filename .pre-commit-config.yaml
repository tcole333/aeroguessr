repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0 # Use the latest stable version
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  # Ruff (Python Linter & Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.5 # Use the latest stable version compatible with ruff.toml
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  # Prettier (JS/TS/JSON/MD Formatter)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8 # Use the latest stable version
    hooks:
      - id: prettier
        types_or: [javascript, ts, tsx, json, css, scss, html, yaml, markdown]
        args: [--write]
