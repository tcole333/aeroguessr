# `uv run pre-commit install` sets up both git hooks. The two test suites run on `git push` (and
# in CI); every other hook runs on every commit.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0 # Use the latest stable version
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        # --enforce-all checks every file it is given, not only new ones, so CI's --all-files
        # run covers the whole tree
        args: ['--maxkb=1024', '--enforce-all'] # Increased limit for files like package-lock.json
      - id: check-merge-conflict
        # Without it the hook checks only during a merge or rebase, so never in CI
        args: ['--assume-in-merge']
      - id: debug-statements

  # Secrets in staged changes. CI's gitleaks job scans each pull request's commits.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1 # Same version as the gitleaks job in ci.yml
    hooks:
      - id: gitleaks

  # Shell scripts and GitHub Actions workflows
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Ruff (Python Linter & Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2 # The ruff pyproject.toml pins (uv.lock) and the CI ruff job installs
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]  # Fix what ruff can; anything left, such as ERA001, fails the commit
      # Run the formatter.
      - id: ruff-format
        args: []  # This will auto-format files

  # Prettier (JS/TS/JSON/MD Formatter)
  - repo: local
    hooks:
      - id: prettier-frontend
        name: Run Prettier (frontend)
        entry: bash
        args:
          - -c
          - |
            set -e;
            cd frontend || exit 1;
            files_to_format=();
            for arg in "$@"; do
              files_to_format+=("${arg#frontend/}");
            done;
            if [ ${#files_to_format[@]} -eq 0 ]; then
              exit 0;
            fi;
            exec node_modules/.bin/prettier --write --ignore-path ../.gitignore "${files_to_format[@]}"
        language: system
        types_or: [javascript, json, css, scss, html, yaml, markdown]
        files: ^frontend/
        pass_filenames: true

  # ESLint for JavaScript/TypeScript
  - repo: local
    hooks:
      - id: eslint-frontend
        name: Run ESLint (frontend)
        entry: bash
        args:
          - -c
          - |
            set -e;
            cd frontend || exit 1;
            files_to_lint=();
            for arg in "$@"; do
              files_to_lint+=("${arg#frontend/}");
            done;
            if [ ${#files_to_lint[@]} -eq 0 ]; then
              exit 0;
            fi;
            exec node_modules/.bin/eslint --fix --ext .js,.jsx,.ts,.tsx "${files_to_lint[@]}"
        language: system
        types_or: [javascript, ts, tsx]
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: true

  # TypeScript type checking
  - repo: local
    hooks:
      - id: frontend-type-check
        name: Frontend TypeScript type check
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: frontend-tests
        name: Run frontend tests
        entry: bash -c 'cd frontend && npm run test:ci'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        stages: [pre-push]
        pass_filenames: false

      - id: run-backend-unit-tests
        name: Run backend unit tests
        entry: uv run pytest tests/backend -m "not integration"
        language: system
        stages: [pre-push]
        pass_filenames: false
