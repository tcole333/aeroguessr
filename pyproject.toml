[tool.poetry]
name = "plane-game-v4"
version = "0.1.0"
description = "Real-time flight tracking map game"
authors = ["Travis Cole <traviscole44@gmail.com>"]
readme = "README.md"

packages = [
    { include = "backend" }
]

[tool.poetry.dependencies]
python = "^3.12"
pyModeS = "^2.20"
redis = {extras = ["hiredis"], version = "^5.0.7"}
pydantic = "^2.11.3"
pytest-asyncio = "^0.26.0"
numpy = "^2.0.0"
filterpy = "^1.4.5"
httpx = "^0.28.1"
httpx-ws = "^0.7.2"
uvicorn = {extras = ["standard"], version = "^0.34.2"}
fastapi = "^0.115.12"
websockets = "^15.0.1"
pytest = "^8.3.5"
geopy = "^2.4.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
fakeredis = {extras = ["aioredis"], version = "^2.28.1"}
pyyaml = "^6.0.2"
#pytest-docker = "^2.0.0"
pytest-cov = "^6.1.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
