[project]
name = "plane-game-v4"
version = "0.1.0-alpha.1"
description = "Real-time flight tracking map game"
authors = [{ name = "Travis Cole", email = "traviscole44@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12,<0.116",
    "filterpy>=1.4.5,<2",
    "geopy>=2.4.1,<3",
    "httpx>=0.28.1,<0.29",
    "numpy>=2.2.5,<3",
    "pydantic>=2.11.3,<3",
    "pydantic-settings>=2.16.0,<3",
    "redis[hiredis]>=5.2.1,<6",
    "uvicorn[standard]>=0.34.2,<0.35",
    "websockets>=15.0.1,<16",
]

[dependency-groups]
dev = [
    "fakeredis>=2.28.1,<3",
    "httpx-ws>=0.7.2,<0.8",
    "pre-commit>=4.2.0,<5",
    "pytest>=8.3.5,<9",
    "pytest-asyncio>=0.26.0,<0.27",
    "pytest-cov>=6.1.1,<7",
    "pytest-timeout>=2.4.0,<3",
    "pyyaml>=6.0.2,<7",
    # Exact, so it moves only with the ruff-pre-commit rev in .pre-commit-config.yaml.
    "ruff==0.12.2",
]

[tool.uv]
# An application, not a library: uv installs the dependencies but never builds or installs
# the project. Code is imported from the checkout (pytest.ini puts the repo root on the path).
package = false
