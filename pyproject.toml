[tool.poetry]
name = "plane-game-v4"
version = "0.1.0"
description = "Real-time flight tracking map game"
authors = ["Travis Cole <traviscole44@gmail.com>"]
readme = "README.md"

packages = [
    { include = "backend" }
]

[tool.poetry.dependencies]
python = "^3.12"
pyModeS = "^2.20"
redis = {extras = ["hiredis"], version = "^5.0.7"}
pydantic = "^2.11.3"
pytest-asyncio = "^0.26.0"
numpy = "^2.0.0"
filterpy = "^1.4.5"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
fakeredis = {extras = ["aioredis"], version = "^2.23.1"}


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
