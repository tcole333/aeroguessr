# `make integration-test` runs pytest inside backend-test, so the stack publishes no host ports
# and runs next to any local Redis or API. The Makefile names its Compose project per checkout.
services:
  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-test:
    build:
      context: ..
      dockerfile: infra/Dockerfile.test
    working_dir: /app
    volumes:
      - ..:/app
    # make integration-test runs pytest in this container with docker compose exec.
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Ensure backend connects to the test Redis instance. pytest runs in this container via
      # `make integration-test` and shares the database with the backend; the real-Redis
      # fixture refuses db 0 (see tests/README.md).
      REDIS_URL: redis://redis-test:6379/1
      TEST_REDIS_URL: redis://redis-test:6379/1
      INTEGRATION_BASE_URL: http://localhost:8000
      # Provide necessary env vars for the running application
      FLIGHTAWARE_API_KEY: "test-key"
      FAKE_ADSB: "1"
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: DEBUG
      # Set short timeout for integration tests
      HOST_DISCONNECT_CLAIM_WINDOW_SECONDS: 2
      # The repo is mounted at /app, so without this the backend would read the developer's .env.
      AEROGUESSR_ENV_FILE: ""
    depends_on:
      redis-test:
        condition: service_healthy
