# Complete Docker Compose configuration for AeroGuessr
# Orchestrates all services: nginx, frontend, backend, redis
# Production-ready deployment with proper networking and dependencies
#
# No container_name here: names come from the Compose project, and `make start` gives each
# checkout its own. The Pi's names and project live in docker-compose.pi.yml.

# Docker's json-file driver keeps a container's output forever unless capped.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Each mem_limit is a few times the service's resident memory on the Pi
# (Oct 2026: backend ~290 MB, frontend and nginx under 20 MB, redis ~10 MB).
# Docker enforces limits only when the kernel's memory cgroup is enabled;
# Raspberry Pi OS boots with cgroup_disable=memory (see docs/deployment.md).

services:
  # Nginx reverse proxy - main entry point
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    networks:
      - plane-game-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend service - serves React app via nginx
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    networks:
      - plane-game-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend API service
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    # Settings come from the repo-root .env, as for native runs; backend/settings.py has the
    # defaults and .env.example lists them. On the Pi that file holds the AeroAPI key.
    env_file:
      - path: ../.env
        required: false
    # Container wiring; these win over the file.
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    networks:
      - plane-game-network
    volumes:
      - ../logs:/app/logs
    healthcheck:
      # Liveness only: /healthz does no I/O, so this fails only when the API
      # process is broken. Do not point it at /readyz: nginx does not start until
      # this service is healthy, so the site would stay offline whenever ingest
      # or the ADS-B feed is down. scripts/auto-update.sh gates deploys on /readyz.
      # Use stdlib Python (always present in this image) instead of curl, which
      # isn't installed in the backend image. urlopen raises on non-2xx/connection
      # failure -> non-zero exit -> unhealthy; succeeds on 200.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis cache and game state
  redis:
    image: redis:7-alpine
    # Every key the game writes has a TTL and the dataset is a few MB, so
    # maxmemory is only a safety net. noeviction rejects writes at the limit
    # instead of evicting keys: the AeroAPI budget counters
    # (aeroapi:result_sets:*) must never disappear, and the budget denies
    # spend on any Redis error. No AOF, which rewrote the Pi's SD card every
    # second; Redis's default RDB snapshots (a few KB, at most once a minute)
    # keep the counters across restarts.
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
      - ../logs:/var/log/redis
    restart: unless-stopped
    logging: *default-logging
    # Room for maxmemory plus the copy-on-write fork of an RDB snapshot.
    mem_limit: 512m
    networks:
      - plane-game-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Named volumes for data persistence
volumes:
  redis-data:
    driver: local

# Internal network for service communication. Docker picks a free subnet; the Pi override
# pins the one the Pi's network was created with.
networks:
  plane-game-network:
    driver: bridge
