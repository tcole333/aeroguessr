# Cloudflare Tunnel configuration for aeroguessr.com
# This file should be copied to /home/pi/.cloudflared/config.yml on the Pi
# The tunnel ID and credentials file will be automatically generated by the setup script

# Tunnel identifier (will be populated by setup script)
tunnel: TUNNEL_ID_PLACEHOLDER

# Path to credentials file (will be created during tunnel creation)
credentials-file: /home/pi/.cloudflared/TUNNEL_ID_PLACEHOLDER.json

# Ingress rules define what traffic to route and where
ingress:
  # Health check endpoint - useful for monitoring
  - hostname: aeroguessr.com
    path: /healthz
    service: http://localhost:80
    originRequest:
      noTLSVerify: true

  # API endpoints - route to backend through nginx
  - hostname: aeroguessr.com
    path: /api/*
    service: http://localhost:80
    originRequest:
      noTLSVerify: true
      # Keep alive for better performance
      keepAliveConnections: 10
      keepAliveTimeout: 90s
      # Timeout settings
      connectTimeout: 30s

  # WebSocket endpoints - special handling for real-time communication
  - hostname: aeroguessr.com
    path: /ws/*
    service: http://localhost:80
    originRequest:
      noTLSVerify: true
      # WebSocket specific settings
      keepAliveConnections: 100
      keepAliveTimeout: 90s
      connectTimeout: 10s
      # Disable chunked encoding for WebSockets
      disableChunkedEncoding: true

  # WWW subdomain - redirect to main domain
  - hostname: www.aeroguessr.com
    service: http://localhost:80
    originRequest:
      noTLSVerify: true
      httpHostHeader: aeroguessr.com

  # Default catch-all rule - serve frontend
  - service: http://localhost:80
    originRequest:
      noTLSVerify: true
      # Keep alive for better performance
      keepAliveConnections: 10
      keepAliveTimeout: 90s
      # Timeout settings
      connectTimeout: 30s

# Optional: Configure logging
# loglevel: info
# logfile: /var/log/cloudflared.log

# Optional: Metrics server for monitoring
# metrics: 0.0.0.0:2000
