# Production Docker Compose for CI/CD deployments
# Uses pre-built images from GitHub Container Registry (GHCR)
# Combine with docker-compose.pi.yml for Pi-specific overrides
#
# Usage:
#   IMAGE_TAG=abc123 docker compose -f docker-compose.deploy.yml -f docker-compose.pi.yml up -d

services:
  # Nginx reverse proxy - main entry point
  nginx:
    image: nginx:alpine
    container_name: plane-game-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - plane-game-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend service - serves React app via nginx
  frontend:
    image: ghcr.io/tcole333/plane-game-v4/frontend:${IMAGE_TAG:-latest}
    container_name: plane-game-frontend
    restart: unless-stopped
    networks:
      - plane-game-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend API service
  backend:
    image: ghcr.io/tcole333/plane-game-v4/backend:${IMAGE_TAG:-latest}
    container_name: plane-game-backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ADSB_HOST=${ADSB_HOST:-host.docker.internal}
      - ADSB_PORT=${ADSB_PORT:-30003}
      - CENTER_LAT=${CENTER_LAT:-42.3656}
      - CENTER_LON=${CENTER_LON:-71.0096}
      - OPENSKY_USERNAME=${OPENSKY_USERNAME}
      - OPENSKY_PASSWORD=${OPENSKY_PASSWORD}
      - FLIGHTAWARE_API_KEY=${FLIGHTAWARE_API_KEY}
      - FAKE_ADSB=${FAKE_ADSB:-0}
      - KALMAN_PROCESS_NOISE=${KALMAN_PROCESS_NOISE:-0.01}
      - KALMAN_MEASUREMENT_NOISE=${KALMAN_MEASUREMENT_NOISE:-3.0}
      - PLANE_TTL_SECONDS=${PLANE_TTL_SECONDS:-300}
      - MAX_ANTENNA_RANGE_KM=${MAX_ANTENNA_RANGE_KM:-250}
      - MIN_UPDATE_INTERVAL_SECONDS=${MIN_UPDATE_INTERVAL_SECONDS:-60}
      # Flight enrichment V2 settings
      - ENRICHMENT_V2_ENABLED=${ENRICHMENT_V2_ENABLED:-1}
      - FLIGHT_SCHEDULE_REFRESH_HOURS=${FLIGHT_SCHEDULE_REFRESH_HOURS:-6}
      # Production settings
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - plane-game-network
    volumes:
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis cache and game state
  redis:
    image: redis:7-alpine
    container_name: plane-game-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
      - ../logs:/var/log/redis
    restart: unless-stopped
    networks:
      - plane-game-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Named volumes for data persistence
volumes:
  redis-data:
    driver: local

# Internal network for service communication
networks:
  plane-game-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
