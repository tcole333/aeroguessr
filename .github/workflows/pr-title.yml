name: PR title

# A squash merge puts the pull request's title on main as the commit message, so the title
# must be a conventional commit (docs/project-standards.md 1.3). A single-commit PR squashes
# with its commit's message instead (see validateSingleCommit below), and merge commits and
# rebase merges skip the title. This is its own workflow so that editing the title re-runs
# only this check, not all of CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: PR title is a conventional commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The types in docs/project-standards.md 1.3
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            ci
            chore
          # A single-commit pull request squashes with that commit's own title while the
          # repository's squash setting is "commit or PR title" (#204 P10), so check it too.
          validateSingleCommit: true
