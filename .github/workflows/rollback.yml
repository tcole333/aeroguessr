name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag or commit SHA to rollback to'
        required: true
        type: string
      reason:
        description: 'Reason for rollback'
        required: false
        type: string

# Ensure only one deployment/rollback runs at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rollback:
    name: Rollback to ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate image exists in GHCR
        run: |
          echo "Checking if image tag ${{ github.event.inputs.version }} exists..."
          # Log in to check image existence
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Check backend image
          if ! docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.event.inputs.version }} > /dev/null 2>&1; then
            echo "ERROR: Backend image with tag ${{ github.event.inputs.version }} not found in GHCR"
            exit 1
          fi

          # Check frontend image
          if ! docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.event.inputs.version }} > /dev/null 2>&1; then
            echo "ERROR: Frontend image with tag ${{ github.event.inputs.version }} not found in GHCR"
            exit 1
          fi

          echo "Both images found, proceeding with rollback..."

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_PRIVATE_KEY }}" > ~/.ssh/pi_deploy_key
          chmod 600 ~/.ssh/pi_deploy_key

      - name: Configure SSH for Cloudflare Access
        run: |
          cat >> ~/.ssh/config << 'EOF'
          Host pi-deploy
            HostName ssh.aeroguessr.com
            User pi
            IdentityFile ~/.ssh/pi_deploy_key
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Execute rollback on Pi
        env:
          IMAGE_TAG: ${{ github.event.inputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
          OPENSKY_USERNAME: ${{ secrets.OPENSKY_USERNAME }}
          OPENSKY_PASSWORD: ${{ secrets.OPENSKY_PASSWORD }}
        run: |
          ssh pi-deploy "
            cd /home/pi/plane-game-v4/infra

            echo 'Logging into GHCR...'
            echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin

            echo 'Rolling back to version: ${IMAGE_TAG}'

            # Export environment variables for compose
            export IMAGE_TAG='${IMAGE_TAG}'
            export FLIGHTAWARE_API_KEY='${FLIGHTAWARE_API_KEY}'
            export OPENSKY_USERNAME='${OPENSKY_USERNAME}'
            export OPENSKY_PASSWORD='${OPENSKY_PASSWORD}'

            # Pull the specific version
            docker compose -f docker-compose.deploy.yml pull

            # Deploy the rolled-back version
            docker compose -f docker-compose.deploy.yml -f docker-compose.pi.yml up -d

            # Update current tag file
            echo '${IMAGE_TAG}' > .current_tag

            echo 'Rollback complete'
          "

      - name: Verify rollback health
        run: |
          echo "Waiting for services to stabilize..."
          sleep 30

          for i in {1..5}; do
            echo "Health check attempt $i..."
            if ssh pi-deploy "curl -sf http://localhost:8000/healthz" > /dev/null 2>&1; then
              echo "Rollback health check passed!"
              exit 0
            fi
            sleep 10
          done

          echo "WARNING: Health check failed after rollback"
          exit 1

      - name: Create rollback annotation
        run: |
          echo "## Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Rolled back to**: ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason**: ${{ github.event.inputs.reason || 'Not specified' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
