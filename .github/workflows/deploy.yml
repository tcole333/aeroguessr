name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test job (deploy directly)'
        required: false
        default: 'false'
        type: boolean

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Run tests first (can be skipped via workflow_dispatch)
  test:
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ./.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Run tests
        run: |
          poetry run pytest -m "not integration" tests/

  # Build ARM64 images natively and push to GHCR
  build:
    name: Build & Push Images
    runs-on: ubuntu-24.04-arm
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      backend_image: ${{ steps.build-backend.outputs.imageid }}
      frontend_image: ${{ steps.build-frontend.outputs.imageid }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

  # Deploy to Raspberry Pi via Cloudflare Tunnel
  deploy:
    name: Deploy to Pi
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_PRIVATE_KEY }}" > ~/.ssh/pi_deploy_key
          chmod 600 ~/.ssh/pi_deploy_key

      - name: Configure SSH for Cloudflare Access
        run: |
          cat >> ~/.ssh/config << 'EOF'
          Host pi-deploy
            HostName ssh.aeroguessr.com
            User pi
            IdentityFile ~/.ssh/pi_deploy_key
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy deployment files to Pi
        run: |
          scp infra/docker-compose.deploy.yml pi-deploy:/home/pi/plane-game-v4/infra/
          scp infra/nginx.conf pi-deploy:/home/pi/plane-game-v4/infra/
          scp scripts/ci-deploy.sh pi-deploy:/home/pi/plane-game-v4/scripts/

      - name: Write secrets file to Pi
        run: |
          # Write secrets to a file on Pi (not echoed to logs)
          ssh pi-deploy 'cat > /home/pi/plane-game-v4/.env.secrets && chmod 600 /home/pi/plane-game-v4/.env.secrets' << 'SECRETS_EOF'
          IMAGE_TAG=${{ github.sha }}
          GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }}
          GHCR_USER=${{ github.actor }}
          FLIGHTAWARE_API_KEY=${{ secrets.FLIGHTAWARE_API_KEY }}
          OPENSKY_USERNAME=${{ secrets.OPENSKY_USERNAME }}
          OPENSKY_PASSWORD=${{ secrets.OPENSKY_PASSWORD }}
          SECRETS_EOF

      - name: Run deployment script on Pi
        run: |
          ssh pi-deploy "
            cd /home/pi/plane-game-v4
            chmod +x scripts/ci-deploy.sh
            ./scripts/ci-deploy.sh
          "

      - name: Verify deployment health
        run: |
          echo "Waiting for services to stabilize..."
          sleep 30

          # Health check via Cloudflare Tunnel
          for i in {1..5}; do
            echo "Health check attempt $i..."
            if ssh pi-deploy "curl -sf http://localhost:8000/healthz" > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 10
          done

          echo "Health check failed after 5 attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, triggering rollback..."
          ssh pi-deploy "
            cd /home/pi/plane-game-v4/infra
            if [ -f .previous_tag ]; then
              PREVIOUS_TAG=\$(cat .previous_tag)
              echo \"Rolling back to \$PREVIOUS_TAG\"
              IMAGE_TAG=\$PREVIOUS_TAG docker compose -f docker-compose.deploy.yml -f docker-compose.pi.yml up -d
            else
              echo 'No previous version to rollback to'
            fi
          " || true
