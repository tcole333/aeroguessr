[pytest]
# uv never installs this project (pyproject.toml), so tests import backend/ from the checkout
# pytest runs in: each worktree tests its own code, whichever venv runs it.
pythonpath = .
asyncio_default_fixture_loop_scope = function
# pytest-timeout fails a hung test with a traceback instead of stalling the run. The slowest
# tests wait about 10 s on round and ping timers, and the live-backend fixture waits up to
# 30 s for the backend to answer, so 60 s leaves headroom over both. Requiring the plugin
# turns a venv that lacks it into an error rather than a silently disabled timeout.
required_plugins = pytest-timeout
timeout = 60
markers =
    asyncio
    integration: needs a real Redis (TEST_REDIS_URL) and, under tests/integration, a live backend (INTEGRATION_BASE_URL); see tests/README.md.
