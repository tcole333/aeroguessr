# Ruff configuration: https://docs.astral.sh/ruff/configuration/

# Same as Black.
line-length = 100
target-version = "py312"

[lint]
# Enable Pyflakes, Pycodestyle, isort, flake8-annotations, flake8-bugbear, etc.
# See full list: https://docs.astral.sh/ruff/rules/
select = ["E", "F", "W", "I", "ANN", "B", "C4", "T20", "PYI"]
ignore = [
    "ANN101", # Missing type annotation for `self` in method
    "ANN102", # Missing type annotation for `cls` in classmethod
    # Allow missing return type annotations for tests for now
    # "ANN201", # Missing return type annotation for public function/method
]

# Allow unused variables when underscore-prefixed.
# dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.isort]
known-first-party = ["backend", "tests"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, skip string normalization.
#skip-string-normalization = true
