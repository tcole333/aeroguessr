# Ruff configuration: https://docs.astral.sh/ruff/configuration/

# Same as Black.
line-length = 100
target-version = "py312"

[lint]
# Enable Pyflakes, Pycodestyle, isort, flake8-annotations, flake8-bugbear, etc.
# See full list: https://docs.astral.sh/ruff/rules/
select = ["E", "F", "W", "I", "ANN", "B", "C4", "T20", "PYI"]
ignore = [
    # ANN101 and ANN102 have been removed in newer ruff versions
    # Allow missing return type annotations for tests for now
    # "ANN201", # Missing return type annotation for public function/method
    "B008", # Do not perform function call `Depends` in argument defaults;
]

# Allow unused variables when underscore-prefixed.
# dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]  # Allow missing type annotations in tests

[lint.isort]
known-first-party = ["backend", "tests"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, skip string normalization.
#skip-string-normalization = true
