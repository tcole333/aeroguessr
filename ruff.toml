# Ruff configuration: https://docs.astral.sh/ruff/configuration/

# Same as Black.
line-length = 100
target-version = "py312"

[lint]
# Enable Pyflakes, Pycodestyle, isort, flake8-annotations, flake8-bugbear, etc.
# See full list: https://docs.astral.sh/ruff/rules/
# ASYNC: blocking calls inside async code. DTZ: datetimes without a timezone.
# S: flake8-bandit's security checks (secrets themselves are gitleaks' job).
# RUF006: an asyncio task nothing references can be garbage-collected before it finishes.
select = ["E", "F", "W", "I", "ANN", "B", "C4", "T20", "PYI", "ERA", "ASYNC", "DTZ", "S", "RUF006"]
ignore = [
    "B008", # Do not perform function call `Depends` in argument defaults;
]

[lint.per-file-ignores]
# Tests: missing type annotations, timeout parameters on async helpers (ASYNC109), assert
# (S101), and subprocess runs of the repo's own scripts and tools (S603, S607)
"tests/*" = ["ANN201", "ANN001", "ASYNC109", "S101", "S603", "S607"]
"scripts/*" = ["T201"]  # Command-line scripts report with print
# The synthetic ADS-B feed's randomness is simulation, not security
"sample_data/adsb_generator.py" = ["S311"]

[lint.isort]
known-first-party = ["backend", "tests"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
